[project]
name = "agent-lab"
version = "0.1.0"
description = "书本助教 Agent、轨迹查看器后端与评估系统（需求 001）"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "trafilatura>=2.3,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_lab", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["agent_lab", "evals"]
omit = ["agent_lab/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
